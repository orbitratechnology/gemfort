name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # firebase-tools 15 refuses to start the Firestore emulator on JDK < 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1

      # Native postinstall steps (e.g. Skia binaries) are not needed here.
      - run: bun install --frozen-lockfile --ignore-scripts

      - run: npm install -g firebase-tools@15.34.1

      # Runs against the demo-gemfort project, so nothing reaches production.
      - run: bun run test:rules:emulator

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening GemFort</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101010; color: #f5f5f5; }
      main { width: min(420px, calc(100% - 40px)); padding: 28px; border: 1px solid #333; border-radius: 18px; background: #191919; text-align: center; box-sizing: border-box; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 22px; color: #bdbdbd; line-height: 1.5; }
      a { display: inline-block; padding: 12px 18px; border-radius: 10px; background: #f5f5f5; color: #111; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening GemFort…</h1>
      <p id="message">If the app does not open automatically, use the button below.</p>
      <a id="open-app" href="#">Open in GemFort</a>
    </main>
    <script>
      (function () {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var kind = parts[0];
        var id = parts[1];
        if (!id || (kind !== 'l' && kind !== 'business')) {
          document.getElementById('message').textContent = 'This GemFort link is incomplete.';
          document.getElementById('open-app').remove();
          return;
        }
        var appPath = kind === 'l' ? 'listing' : 'business';
        var appUrl = 'gemfort:///' + appPath + '/' + encodeURIComponent(id);
        var openButton = document.getElementById('open-app');
        openButton.href = appUrl;
        window.location.replace(appUrl);
      }());
    </script>
  </body>
</html>
